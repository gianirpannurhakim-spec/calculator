<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator Sederhana</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calculator" role="application" aria-label="Kalkulator">
    <section class="display">
      <div class="history" id="history" aria-live="polite"></div>
      <div class="expression" id="expression">0</div>
      <div class="result" id="result" aria-live="polite"></div>
    </section>

    <section class="keys">
      <button type="button" class="key key--action" data-action="clear">AC</button>
      <button type="button" class="key key--action" data-action="delete" aria-label="Hapus satu karakter">DEL</button>
      <button type="button" class="key key--action" data-action="percent" aria-label="Persen">%</button>
      <button type="button" class="key key--operator" data-operator="/" aria-label="Bagi">÷</button>

      <button type="button" class="key" data-digit="7">7</button>
      <button type="button" class="key" data-digit="8">8</button>
      <button type="button" class="key" data-digit="9">9</button>
      <button type="button" class="key key--operator" data-operator="*" aria-label="Kali">×</button>

      <button type="button" class="key" data-digit="4">4</button>
      <button type="button" class="key" data-digit="5">5</button>
      <button type="button" class="key" data-digit="6">6</button>
      <button type="button" class="key key--operator" data-operator="-" aria-label="Kurang">−</button>

      <button type="button" class="key" data-digit="1">1</button>
      <button type="button" class="key" data-digit="2">2</button>
      <button type="button" class="key" data-digit="3">3</button>
      <button type="button" class="key key--operator" data-operator="+" aria-label="Tambah">+</button>

      <button type="button" class="key" data-action="sign" aria-label="Ubah tanda">+/−</button>
      <button type="button" class="key" data-digit="0">0</button>
      <button type="button" class="key" data-action="decimal" aria-label="Koma desimal">,</button>
      <button type="button" class="key key--equals" data-action="equals" aria-label="Sama dengan">=</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
